name: hand-glint-contract
run-name: ${{ github.ref_name }}

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hand-glint-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: verify Apple Silicon runner
        run: |
          uname -a
          test "$(uname -m)" = "arm64"
      - name: validate generic Metal first-person glint execution path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pipeline = Path('src/main/java/com/metallum/render/MetalCompiledRenderPipeline.java').read_text(encoding='utf-8')
          render_pass = Path('src/main/java/com/metallum/render/MetalRenderPass.java').read_text(encoding='utf-8')

          required_descriptor = (
              'long attributeIndex = 0L;',
              'int bufferIndex = firstAvailableBufferSlot + binding;',
              'format.getVertexSize(),',
              'MTLVertexFormat vertexFormat = MTLVertexFormat.from(element.format());',
              'descriptor.setAttribute(attributeIndex, vertexFormat.value, element.offset(), bufferIndex);',
              'attributeIndex++;',
          )
          missing = [needle for needle in required_descriptor if needle not in pipeline]
          if missing:
              raise SystemExit('Metal hand-glint POSITION_TEX descriptor routing is incomplete: ' + ', '.join(missing))

          required_binding = (
              'int firstSlot = compiledPipeline.firstAvailableVertexBufferSlot();',
              'int count = compiledPipeline.vertexBufferCount();',
              'int metalSlot = firstSlot + slot;',
              'enc.setVertexBuffer(nativeVertexBuffer.metalBuffer(), vertexBuffer.offset(), metalSlot);',
              'samplers.put(name, new TextureViewAndSampler(textureView, sampler));',
              'bindTextureAndSampler(enc, textureView.nativeHandle(), sampler.nativeHandle(), binding.bindingIndex(), binding.stageMask());',
              'enc.setFragmentTexture(texture, index);',
              'enc.setFragmentSamplerState(sampler, index);',
          )
          missing = [needle for needle in required_binding if needle not in render_pass]
          if missing:
              raise SystemExit('Metal hand-glint buffer/texture binding is incomplete: ' + ', '.join(missing))

          print('Metal hand-glint path: Vitrail-supplied POSITION_TEX format and sampled glint texture stay on generic bindings')
          PY
      - name: validate hand-glint smoke launcher
        run: |
          bash -n tools/run-vitrail-smoke.sh
          grep -q -- '--hand-glint-fixture' tools/run-vitrail-smoke.sh
          grep -q -- '--hand-water-glint-fixture' tools/run-vitrail-smoke.sh
          grep -q 'hand-glint-contract' tools/run-vitrail-smoke.sh
          grep -q 'hand-water-glint-contract' tools/run-vitrail-smoke.sh
          grep -q 'VerifyHandGlintScreenshot.java' tools/run-vitrail-smoke.sh
          grep -Fq 'gbuffers_armor_glint of hand-glint-contract at render stage HAND_SOLID' tools/run-vitrail-smoke.sh
          grep -Fq 'gbuffers_armor_glint of hand-water-glint-contract at render stage HAND_TRANSLUCENT' tools/run-vitrail-smoke.sh
          grep -Fq 'The hand_glint pass records its first draw with gbuffers_armor_glint' tools/run-vitrail-smoke.sh
          grep -Fq 'The hand_water_glint pass records its first draw with gbuffers_armor_glint' tools/run-vitrail-smoke.sh
          grep -Fq 'enchanted_glint_(item|armor)' tools/run-vitrail-smoke.sh
          grep -Fq '[colortex1 MAIN]' tools/run-vitrail-smoke.sh
          grep -Fq 'Stopping!' tools/run-vitrail-smoke.sh
