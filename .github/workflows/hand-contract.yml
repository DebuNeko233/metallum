name: hand-contract
run-name: ${{ github.ref_name }}

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hand-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: verify Apple Silicon runner
        run: |
          uname -a
          test "$(uname -m)" = "arm64"
      - name: validate generic Metal hand vertex and sampler path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pipeline = Path('src/main/java/com/metallum/render/MetalCompiledRenderPipeline.java').read_text(encoding='utf-8')
          render_pass = Path('src/main/java/com/metallum/render/MetalRenderPass.java').read_text(encoding='utf-8')

          required_descriptor = (
              'long attributeIndex = 0L;',
              'int bufferIndex = firstAvailableBufferSlot + binding;',
              'format.getVertexSize(),',
              'long stepRate = format.getStepRate();',
              'MTLVertexFormat vertexFormat = MTLVertexFormat.from(element.format());',
              'descriptor.setAttribute(attributeIndex, vertexFormat.value, element.offset(), bufferIndex);',
              'attributeIndex++;',
          )
          missing = [needle for needle in required_descriptor if needle not in pipeline]
          if missing:
              raise SystemExit('Metal hand vertex descriptor routing is incomplete: ' + ', '.join(missing))

          required_binding = (
              'int firstSlot = compiledPipeline.firstAvailableVertexBufferSlot();',
              'int count = compiledPipeline.vertexBufferCount();',
              'int metalSlot = firstSlot + slot;',
              'enc.setVertexBuffer(nativeVertexBuffer.metalBuffer(), vertexBuffer.offset(), metalSlot);',
              'samplers.put(name, new TextureViewAndSampler(textureView, sampler));',
              'bindTextureAndSampler(enc, textureView.nativeHandle(), sampler.nativeHandle(), binding.bindingIndex(), binding.stageMask());',
              'enc.setFragmentTexture(texture, index);',
              'enc.setFragmentSamplerState(sampler, index);',
          )
          missing = [needle for needle in required_binding if needle not in render_pass]
          if missing:
              raise SystemExit('Metal hand vertex/texture binding is incomplete: ' + ', '.join(missing))

          print('Metal hand path: Vitrail hand programs stay on the generic entity vertex and sampled-texture bindings')
          PY
      - name: validate hand smoke launcher
        run: |
          bash -n tools/run-vitrail-smoke.sh
          grep -q -- '--hand-fixture' tools/run-vitrail-smoke.sh
          grep -q -- '--hand-water-fixture' tools/run-vitrail-smoke.sh
          grep -q 'hand-contract' tools/run-vitrail-smoke.sh
          grep -q 'hand-water-contract' tools/run-vitrail-smoke.sh
          grep -q 'VerifyHandScreenshot.java' tools/run-vitrail-smoke.sh
          grep -Fq 'gbuffers_hand of hand-contract at render stage HAND_SOLID' tools/run-vitrail-smoke.sh
          grep -Fq 'gbuffers_hand_water of hand-water-contract at render stage HAND_TRANSLUCENT' tools/run-vitrail-smoke.sh
          grep -Fq 'records its first draw with gbuffers_hand, reading minecraft:' tools/run-vitrail-smoke.sh
          grep -Fq 'records its first draw with gbuffers_hand_water, reading minecraft:' tools/run-vitrail-smoke.sh
