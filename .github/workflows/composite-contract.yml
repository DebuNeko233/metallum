name: composite-contract
run-name: ${{ github.ref_name }}

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composite-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: verify Apple Silicon runner
        run: |
          uname -a
          test "$(uname -m)" = "arm64"
      - name: validate generic Metal Composite history prerequisites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          encoder = Path('src/main/java/com/metallum/render/MetalCommandEncoder.java').read_text(encoding='utf-8')
          render_pass = Path('src/main/java/com/metallum/render/MetalRenderPass.java').read_text(encoding='utf-8')
          backend = '\n'.join(p.read_text(encoding='utf-8') for p in Path('src/main/java/com/metallum').rglob('*.java'))

          copy = (
              'public void copyTextureToTexture(',
              'flushPendingClear(srcTexture);',
              'flushPendingClearForWrite(dstTexture);',
              'MTLBlitCommandEncoder blit = blitCommandEncoder();',
              'blit.copyFromTextureToTexture(',
              'srcTexture.nativeHandle(),',
              'dstTexture.nativeHandle(),',
          )
          missing=[x for x in copy if x not in encoder]
          if missing: raise SystemExit('Generic Metal texture-copy prerequisites incomplete: ' + ', '.join(missing))

          sync = (
              'encoder.waitForFence(fence);',
              'blitEncoder.updateFence(fence);',
              'renderEncoder.updateFence(fence, MTLRenderStages.VertexAndFragment);',
              'encoder.waitForFence(fence, MTLRenderStages.VertexAndFragment);',
          )
          missing=[x for x in sync if x not in encoder]
          if missing: raise SystemExit('Generic Metal render/blit fence contract incomplete: ' + ', '.join(missing))

          sampled = (
              'samplers.put(name, new TextureViewAndSampler(textureView, sampler));',
              'bindTextureAndSampler(enc, textureView.nativeHandle(), sampler.nativeHandle(), binding.bindingIndex(), binding.stageMask());',
          )
          missing=[x for x in sampled if x not in render_pass]
          if missing: raise SystemExit('Generic Metal sampled-target prerequisites incomplete: ' + ', '.join(missing))

          for forbidden in ('composite-flip-contract','composite-history-contract','colortex2clear','swapback'):
              if forbidden in backend.lower(): raise SystemExit('Shader-pack Composite semantics leaked into Metallum production source: ' + forbidden)
          print('Metal Composite prerequisites remain generic: sampled render targets + fenced render/blit texture copy')
          PY
      - name: validate batched real-device launcher
        run: |
          bash -n tools/run-vitrail-composite-smoke.sh
          grep -q 'composite-flip-contract' tools/run-vitrail-composite-smoke.sh
          grep -q 'composite-history-contract' tools/run-vitrail-composite-smoke.sh
          grep -q 'VerifyCompositeScreenshot.java' tools/run-vitrail-composite-smoke.sh
          grep -q -- '--verify-existing' tools/run-vitrail-composite-smoke.sh
          grep -q 'PHASE 11 composite flip parity: PASS' tools/run-vitrail-composite-smoke.sh
          grep -q 'PHASE 11 composite temporal/history: PASS' tools/run-vitrail-composite-smoke.sh
          grep -Fq 'Stopping!' tools/run-vitrail-composite-smoke.sh
