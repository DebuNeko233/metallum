name: sky-contract
run-name: ${{ github.ref_name }}

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sky-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: verify Apple Silicon runner
        run: |
          uname -a
          test "$(uname -m)" = "arm64"
      - name: validate generic Metal sky vertex and triangle-fan paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pipeline = Path('src/main/java/com/metallum/render/MetalCompiledRenderPipeline.java').read_text(encoding='utf-8')
          render_pass = Path('src/main/java/com/metallum/render/MetalRenderPass.java').read_text(encoding='utf-8')
          backend = '\n'.join(path.read_text(encoding='utf-8') for path in Path('src/main/java/com/metallum').rglob('*.java'))

          required_vertex = (
              'int bindingCount = info.getVertexFormatBindings().length;',
              'VertexFormat format = info.getVertexFormatBinding(binding);',
              'format.getVertexSize()',
              'for (VertexFormatElement element : format.getElements())',
              'element.offset()',
              'descriptor.setAttribute(attributeIndex, vertexFormat.value, element.offset(), bufferIndex);',
              'attributeIndex++;',
          )
          missing = [needle for needle in required_vertex if needle not in pipeline]
          if missing:
              raise SystemExit('Metal sky carried-format vertex support is incomplete: ' + ', '.join(missing))

          required_fan = (
              'if (primitiveType == MTLPrimitiveType.TriangleFan)',
              'drawTriangleFan(enc, firstVertex, vertexCount, instanceCount, firstInstance);',
              'private void drawTriangleFan(',
              'int triangleCount = vertexCount - 2;',
              'indices.put((short) 0)',
              '.put((short) (i + 1))',
              '.put((short) (i + 2))',
          )
          missing = [needle for needle in required_fan if needle not in render_pass]
          if missing:
              raise SystemExit('Metal triangle-fan conversion needed by sky disc/sunrise is incomplete: ' + ', '.join(missing))

          required_texture = (
              'public void bindTexture(final @NonNull String name',
              'samplers.put(name, new TextureViewAndSampler(textureView, sampler));',
              'bindTexture(enc, textureView.nativeHandle(), binding.bindingIndex(), binding.stageMask());',
          )
          missing = [needle for needle in required_texture if needle not in render_pass]
          if missing:
              raise SystemExit('Metal reflected sky texture binding support is incomplete: ' + ', '.join(missing))

          for forbidden in ('gbuffers_skybasic', 'gbuffers_skytextured', 'CUSTOM_SKY', 'end_sky.png', 'celestials.png'):
              if forbidden in backend:
                  raise SystemExit('Shader-family sky semantics leaked into Metallum backend source: ' + forbidden)

          print('Metal sky path: generic carried formats, triangle-fan conversion and reflected textures remain family-neutral')
          PY
      - name: validate sky smoke launcher
        run: |
          bash -n tools/run-vitrail-sky-smoke.sh
          grep -q 'sky-contract' tools/run-vitrail-sky-smoke.sh
          grep -q 'VerifySkyScreenshot.java' tools/run-vitrail-sky-smoke.sh
          grep -Fq -- '--overworld' tools/run-vitrail-sky-smoke.sh
          grep -Fq -- '--end' tools/run-vitrail-sky-smoke.sh
          grep -Fq 'gbuffers_skybasic' tools/run-vitrail-sky-smoke.sh
          grep -Fq 'gbuffers_skytextured' tools/run-vitrail-sky-smoke.sh
          grep -Fq 'render stage SKY' tools/run-vitrail-sky-smoke.sh
          grep -Fq 'render stage SUNSET' tools/run-vitrail-sky-smoke.sh
          grep -Fq 'render stage CUSTOM_SKY' tools/run-vitrail-sky-smoke.sh
          grep -Fq 'minecraft:textures/atlas/celestials' tools/run-vitrail-sky-smoke.sh
          grep -Fq 'minecraft:textures/environment/end_sky' tools/run-vitrail-sky-smoke.sh
          grep -Fq '[colortex1 MAIN]' tools/run-vitrail-sky-smoke.sh
          grep -Fq 'coverage mask' tools/run-vitrail-sky-smoke.sh
          grep -Fq 'Stopping!' tools/run-vitrail-sky-smoke.sh
