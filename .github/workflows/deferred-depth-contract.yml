name: deferred-depth-contract
run-name: ${{ github.ref_name }}

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deferred-depth-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: verify Apple Silicon runner
        run: |
          uname -a
          test "$(uname -m)" = "arm64"
      - name: validate generic Metal deferred R32F render-to-sample ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path

          formats = Path('src/main/java/com/metallum/mtl/MTLPixelFormat.java').read_text(encoding='utf-8')
          texture = Path('src/main/java/com/metallum/render/MetalGpuTexture.java').read_text(encoding='utf-8')
          encoder = Path('src/main/java/com/metallum/render/MetalCommandEncoder.java').read_text(encoding='utf-8')
          render_pass = Path('src/main/java/com/metallum/render/MetalRenderPass.java').read_text(encoding='utf-8')
          backend = '\n'.join(path.read_text(encoding='utf-8') for path in Path('src/main/java/com/metallum').rglob('*.java'))

          if 'case R32_FLOAT -> R32Float;' not in formats:
              raise SystemExit('Generic R32_FLOAT -> R32Float mapping is missing')

          required_usage = (
              'if ((usage & GpuTexture.USAGE_RENDER_ATTACHMENT) != 0)',
              'result |= MTLTextureUsage.RenderTarget.value;',
              'result |= MTLTextureUsage.ShaderRead.value;',
          )
          missing = [needle for needle in required_usage if needle not in texture]
          if missing:
              raise SystemExit('Metal R32F render-to-sample usage is incomplete: ' + ', '.join(missing))

          lifecycle = (
              'currentRenderPass.materializePendingClear();',
              'MetalPipelineSupport.sameHandles(renderColorAttachments, colorAttachments)',
              'endEncoder();',
              'renderEncoder.updateFence(fence, MTLRenderStages.VertexAndFragment);',
              'currentEncoder.endEncoding();',
              'encoder.waitForFence(fence, MTLRenderStages.VertexAndFragment);',
          )
          missing = [needle for needle in lifecycle if needle not in encoder]
          if missing:
              raise SystemExit('Metal render-to-sampled-pass ordering is incomplete: ' + ', '.join(missing))

          required_binding = (
              'samplers.put(name, new TextureViewAndSampler(textureView, sampler));',
              'commandEncoder.flushPendingClear((MetalGpuTexture) textureView.texture());',
              'bindTextureAndSampler(enc, textureView.nativeHandle(), sampler.nativeHandle(), binding.bindingIndex(), binding.stageMask());',
          )
          missing = [needle for needle in required_binding if needle not in render_pass]
          if missing:
              raise SystemExit('Metal reflected sampled-texture binding is incomplete: ' + ', '.join(missing))

          for forbidden in ('depthtex0', 'deferred-depth-contract', 'Vitrail depth window'):
              if forbidden in backend:
                  raise SystemExit('Vitrail Deferred/depth semantics leaked into Metallum backend source: ' + forbidden)

          print('Metal PHASE 10 Deferred depth prerequisite: generic R32F render-to-sample plus render-pass fences remain backend-neutral')
          PY
      - name: validate PHASE 10 deferred depth launcher
        run: |
          bash -n tools/run-vitrail-deferred-depth-smoke.sh
          grep -q 'deferred-depth-contract' tools/run-vitrail-deferred-depth-smoke.sh
          grep -q 'VerifyDeferredDepthScreenshot.java' tools/run-vitrail-deferred-depth-smoke.sh
          grep -q -- '--verify-existing' tools/run-vitrail-deferred-depth-smoke.sh
          grep -q 'deferred writes colortex0 alt' tools/run-vitrail-deferred-depth-smoke.sh
          grep -q 'deferred1 writes colortex0 main' tools/run-vitrail-deferred-depth-smoke.sh
          grep -q 'deferred2 writes colortex0 alt' tools/run-vitrail-deferred-depth-smoke.sh
          grep -q "samplers this chain read the world's depth" tools/run-vitrail-deferred-depth-smoke.sh
          grep -q 'depthtex0' tools/run-vitrail-deferred-depth-smoke.sh
          grep -Fq "The world's depth is converted into the pack's window in two images" tools/run-vitrail-deferred-depth-smoke.sh
          grep -Fq 'Vitrail depth window' tools/run-vitrail-deferred-depth-smoke.sh
          grep -Fq 'Stopping!' tools/run-vitrail-deferred-depth-smoke.sh
