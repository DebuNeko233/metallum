name: weather-contract
run-name: ${{ github.ref_name }}

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weather-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: verify Apple Silicon runner
        run: |
          uname -a
          test "$(uname -m)" = "arm64"
      - name: validate generic Metal weather execution path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pipeline = Path('src/main/java/com/metallum/render/MetalCompiledRenderPipeline.java').read_text(encoding='utf-8')
          render_pass = Path('src/main/java/com/metallum/render/MetalRenderPass.java').read_text(encoding='utf-8')

          required_descriptor = (
              'long attributeIndex = 0L;',
              'int bufferIndex = firstAvailableBufferSlot + binding;',
              'format.getVertexSize(),',
              'long stepRate = format.getStepRate();',
              'MTLVertexFormat vertexFormat = MTLVertexFormat.from(element.format());',
              'descriptor.setAttribute(attributeIndex, vertexFormat.value, element.offset(), bufferIndex);',
              'attributeIndex++;',
          )
          missing = [needle for needle in required_descriptor if needle not in pipeline]
          if missing:
              raise SystemExit('Metal weather/PARTICLE vertex descriptor routing is incomplete: ' + ', '.join(missing))

          required_binding = (
              'int firstSlot = compiledPipeline.firstAvailableVertexBufferSlot();',
              'int count = compiledPipeline.vertexBufferCount();',
              'int metalSlot = firstSlot + slot;',
              'enc.setVertexBuffer(nativeVertexBuffer.metalBuffer(), vertexBuffer.offset(), metalSlot);',
              'samplers.put(name, new TextureViewAndSampler(textureView, sampler));',
              'bindTextureAndSampler(enc, textureView.nativeHandle(), sampler.nativeHandle(), binding.bindingIndex(), binding.stageMask());',
              'enc.setFragmentTexture(texture, index);',
              'enc.setFragmentSamplerState(sampler, index);',
          )
          missing = [needle for needle in required_binding if needle not in render_pass]
          if missing:
              raise SystemExit('Metal weather vertex/texture binding is incomplete: ' + ', '.join(missing))

          native = '\n'.join(path.read_text(encoding='utf-8') for path in Path('src/main/java').rglob('*.java'))
          if 'gbuffers_weather' in native or 'RAIN_SNOW' in native:
              raise SystemExit('Weather shader-family semantics leaked into Metallum native/backend code')

          print('Metal weather path: Vitrail-supplied PARTICLE format and per-draw rain/snow image stay on generic bindings')
          PY
      - name: validate weather smoke launcher
        run: |
          bash -n tools/run-vitrail-weather-smoke.sh
          grep -q 'weather-contract' tools/run-vitrail-weather-smoke.sh
          grep -q 'VerifyWeatherScreenshot.java' tools/run-vitrail-weather-smoke.sh
          grep -q 'gbuffers_weather' tools/run-vitrail-weather-smoke.sh
          grep -q 'RAIN_SNOW' tools/run-vitrail-weather-smoke.sh
          grep -q 'textures/environment/(rain|snow)' tools/run-vitrail-weather-smoke.sh
          grep -Fq '[colortex1 MAIN]' tools/run-vitrail-weather-smoke.sh
          grep -Fq 'Stopping!' tools/run-vitrail-weather-smoke.sh
