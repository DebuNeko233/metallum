name: apply graphics storage image fix

on:
  push:
    branches:
      - feat/mc26.2-mrt-foundation

permissions:
  contents: write
  actions: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(ci): apply graphics storage image fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mc26.2-mrt-foundation
          fetch-depth: 0

      - name: Patch generic graphics storage-image execution
        run: |
          python3 - <<'PY'
          from pathlib import Path

          render_path = Path('src/main/java/com/metallum/render/MetalRenderPass.java')
          command_path = Path('src/main/java/com/metallum/render/MetalCommandEncoder.java')
          ci_path = Path('.github/workflows/ci.yml')

          render = render_path.read_text(encoding='utf-8')
          command = command_path.read_text(encoding='utf-8')
          ci = ci_path.read_text(encoding='utf-8')

          old = '    private boolean pipelineDirty = true;\n'
          new = '''    private boolean pipelineDirty = true;\n\n    /**\n     * A draw in this logical pass bound a writable storage image. Metal textures are created with\n     * untracked hazard tracking, so the logical pass boundary must end the native render encoder\n     * and let the existing fence chain make those shader writes visible to a later pass. This flag\n     * does not claim ordering between dependent draws inside the same logical RenderPass.\n     */\n    private boolean graphicsStorageImageWrites;\n'''
          if render.count(old) != 1:
              raise SystemExit('MetalRenderPass pipelineDirty anchor changed')
          render = render.replace(old, new, 1)

          old = '''        if (binding.kind() == MetalCompiledRenderPipeline.ResourceKind.STORAGE_IMAGE) {\n            TextureViewAndSampler textureBinding = samplers.get(binding.name());\n            if (textureBinding == null) {\n                throw new IllegalStateException("Missing storage image " + binding.name());\n            }\n            MetalGpuTextureView textureView = (MetalGpuTextureView) textureBinding.textureView();\n            bindTexture(enc, textureView.nativeHandle(), binding.bindingIndex(), binding.stageMask());\n            return;\n        }\n'''
          new = '''        if (binding.kind() == MetalCompiledRenderPipeline.ResourceKind.STORAGE_IMAGE) {\n            TextureViewAndSampler textureBinding = samplers.get(binding.name());\n            if (textureBinding == null) {\n                throw new IllegalStateException("Missing storage image " + binding.name());\n            }\n            MetalGpuTextureView textureView = (MetalGpuTextureView) textureBinding.textureView();\n            noteGraphicsStorageImageWrite(textureView);\n            bindTexture(enc, textureView.nativeHandle(), binding.bindingIndex(), binding.stageMask());\n            return;\n        }\n'''
          if render.count(old) != 1:
              raise SystemExit('direct storage-image descriptor block changed')
          render = render.replace(old, new, 1)

          old = '''        if (binding.kind() == MetalCompiledRenderPipeline.ResourceKind.STORAGE_IMAGE) {\n            TextureViewAndSampler textureBinding = requiredTexture(binding.name(), "storage image");\n            MetalGpuTextureView textureView = (MetalGpuTextureView) textureBinding.textureView();\n            forEachArgumentLayout(binding, layout -> {\n                MTLBuffer argumentBuffer = requireArgumentBuffer(layout);\n                layout.encoder().setArgumentBuffer(argumentBuffer, 0L);\n                layout.encoder().setTexture(textureView.nativeHandle(), binding.metalIndex());\n                enc.useResource(\n                        textureView.nativeHandle(),\n                        MTLRenderCommandEncoder.RESOURCE_USAGE_READ | MTLRenderCommandEncoder.RESOURCE_USAGE_WRITE,\n                        renderStage(layout.stageMask())\n                );\n            });\n            return;\n        }\n'''
          new = '''        if (binding.kind() == MetalCompiledRenderPipeline.ResourceKind.STORAGE_IMAGE) {\n            TextureViewAndSampler textureBinding = requiredTexture(binding.name(), "storage image");\n            MetalGpuTextureView textureView = (MetalGpuTextureView) textureBinding.textureView();\n            noteGraphicsStorageImageWrite(textureView);\n            forEachArgumentLayout(binding, layout -> {\n                MTLBuffer argumentBuffer = requireArgumentBuffer(layout);\n                layout.encoder().setArgumentBuffer(argumentBuffer, 0L);\n                layout.encoder().setTexture(textureView.nativeHandle(), binding.metalIndex());\n                enc.useResource(\n                        textureView.nativeHandle(),\n                        MTLRenderCommandEncoder.RESOURCE_USAGE_READ | MTLRenderCommandEncoder.RESOURCE_USAGE_WRITE,\n                        renderStage(layout.stageMask())\n                );\n            });\n            return;\n        }\n'''
          if render.count(old) != 1:
              raise SystemExit('argument-buffer storage-image descriptor block changed')
          render = render.replace(old, new, 1)

          anchor = '''    private TextureViewAndSampler requiredTexture(final String name, final String description) {\n'''
          helper = '''    private void noteGraphicsStorageImageWrite(final MetalGpuTextureView textureView) {\n        // Compute storage-image writes already invalidate this cache in MetalComputeBridge. Graphics\n        // imageStore has the same ownership effect: after this draw, an old materialized clear no\n        // longer describes the texture and must not suppress a later clear of the same numeric value.\n        ((MetalGpuTexture) textureView.texture()).markContentsDirty();\n        this.graphicsStorageImageWrites = true;\n    }\n\n    boolean hasGraphicsStorageImageWrites() {\n        return this.graphicsStorageImageWrites;\n    }\n\n'''
          if render.count(anchor) != 1:
              raise SystemExit('requiredTexture anchor changed')
          render = render.replace(anchor, helper + anchor, 1)

          old = '''    @Override\n    public void submitRenderPass() {\n        if (currentRenderPass != null) {\n            currentRenderPass.materializePendingClear();\n            currentRenderPass.popDebugGroup();\n            currentRenderPass = null;\n        }\n    }\n'''
          new = '''    @Override\n    public void submitRenderPass() {\n        if (currentRenderPass != null) {\n            boolean graphicsStorageImageWrites = currentRenderPass.hasGraphicsStorageImageWrites();\n            currentRenderPass.materializePendingClear();\n            currentRenderPass.popDebugGroup();\n            currentRenderPass = null;\n\n            // Logical RenderPass boundaries are normally allowed to reuse one native render encoder\n            // when their attachments match. A shader write through an untracked storage texture is\n            // the exception: end this encoder so its normal fence update/wait chain orders that write\n            // before resources are rebound by the next logical pass.\n            if (graphicsStorageImageWrites) {\n                endEncoder();\n            }\n        }\n    }\n'''
          if command.count(old) != 1:
              raise SystemExit('submitRenderPass block changed')
          command = command.replace(old, new, 1)

          contract = '''#!/usr/bin/env python3\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nRENDER = ROOT / "src/main/java/com/metallum/render/MetalRenderPass.java"\nCOMMAND = ROOT / "src/main/java/com/metallum/render/MetalCommandEncoder.java"\nCOMPUTE = ROOT / "src/main/java/com/metallum/render/MetalComputeBridge.java"\n\n\ndef text(path: Path) -> str:\n    return path.read_text(encoding="utf-8")\n\n\nrender = text(RENDER)\ncommand = text(COMMAND)\ncompute = text(COMPUTE)\n\nif render.count("noteGraphicsStorageImageWrite(textureView);") != 2:\n    raise SystemExit("graphics storage images must invalidate state on both direct and argument-buffer descriptor paths")\nfor needle in (\n    "((MetalGpuTexture) textureView.texture()).markContentsDirty();",\n    "this.graphicsStorageImageWrites = true;",\n    "boolean hasGraphicsStorageImageWrites()",\n):\n    if needle not in render:\n        raise SystemExit("missing graphics storage-image ownership contract: " + needle)\n\nif "((MetalGpuTexture) view.texture()).markContentsDirty();" not in compute:\n    raise SystemExit("compute storage-image writes no longer invalidate texture clear state")\n\nsubmit = command.index("public void submitRenderPass()")\nflag = command.index("currentRenderPass.hasGraphicsStorageImageWrites()", submit)\nclose = command.index("currentRenderPass = null;", flag)\nfence = command.index("endEncoder();", close)\nif not submit < flag < close < fence:\n    raise SystemExit("graphics storage-image pass boundary is not ordered before the native encoder fence transition")\n\nfor forbidden in ("Photon", "photon", "colorimg", "gbuffers_", "shadowtex"):\n    if forbidden in render or forbidden in command:\n        raise SystemExit("graphics storage-image backend contract leaked shader-pack semantics: " + forbidden)\n\nprint("Metal graphics storage-image ownership/synchronization contract: PASS")\n'''
          Path('tools/ci-graphics-storage-images.py').write_text(contract, encoding='utf-8')

          ci_anchor = '          python3 tools/ci-argument-buffer-samplers.py\n'
          if ci.count(ci_anchor) != 1:
              raise SystemExit('consolidated CI sampler-contract anchor changed')
          ci = ci.replace(ci_anchor, ci_anchor + '          python3 tools/ci-graphics-storage-images.py\n', 1)

          render_path.write_text(render, encoding='utf-8')
          command_path.write_text(command, encoding='utf-8')
          ci_path.write_text(ci, encoding='utf-8')
          Path('.github/workflows/apply-graphics-storage-image-fix.yml').unlink()
          PY

          python3 tools/ci-graphics-storage-images.py
          python3 tools/ci-argument-buffer-samplers.py

      - name: Commit generic fix
        run: |
          git config user.name 'DebuNeko233'
          git config user.email '101854723+DebuNeko233@users.noreply.github.com'
          git add -A
          git commit -m 'fix(render): fence graphics storage image writes'
          git push origin HEAD:feat/mc26.2-mrt-foundation

      - name: Dispatch consolidated CI for patched head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref feat/mc26.2-mrt-foundation
