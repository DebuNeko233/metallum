name: shadow-batch-contract
run-name: ${{ github.ref_name }}

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-batch-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: verify Apple Silicon runner
        run: |
          uname -a
          test "$(uname -m)" = "arm64"
      - name: validate generic Metal shadow batch prerequisites
        run: |
          python3 - <<'PY'
          from pathlib import Path

          formats = Path('src/main/java/com/metallum/mtl/MTLPixelFormat.java').read_text(encoding='utf-8')
          compare = Path('src/main/java/com/metallum/mtl/MTLCompareFunction.java').read_text(encoding='utf-8')
          pipeline = Path('src/main/java/com/metallum/render/MetalCompiledRenderPipeline.java').read_text(encoding='utf-8')
          texture = Path('src/main/java/com/metallum/render/MetalGpuTexture.java').read_text(encoding='utf-8')
          render_pass = Path('src/main/java/com/metallum/render/MetalRenderPass.java').read_text(encoding='utf-8')
          encoder = Path('src/main/java/com/metallum/render/MetalCommandEncoder.java').read_text(encoding='utf-8')
          backend = '\n'.join(path.read_text(encoding='utf-8') for path in Path('src/main/java/com/metallum').rglob('*.java'))

          if 'case D32_FLOAT -> Depth32Float;' not in formats:
              raise SystemExit('Metal D32_FLOAT -> Depth32Float mapping needed by Vitrail shadow depth is missing')
          if 'case LESS_THAN_OR_EQUAL -> LessEqual;' not in compare:
              raise SystemExit('Metal forward shadow depth compare mapping is missing')

          required_pipeline = (
              'private static final int MAX_COLOR_ATTACHMENTS = 8;',
              'this.cullMode = info.isCull() ? MTLCullMode.Back : MTLCullMode.None;',
              'depthCompareOp = MTLCompareFunction.from(depthStencilState.depthTest());',
              'descriptor.setAttribute(attributeIndex, vertexFormat.value, element.offset(), bufferIndex);',
          )
          missing = [needle for needle in required_pipeline if needle not in pipeline]
          if missing:
              raise SystemExit('Metal generic shadow pipeline prerequisites are incomplete: ' + ', '.join(missing))

          required_usage = (
              'if ((usage & GpuTexture.USAGE_RENDER_ATTACHMENT) != 0)',
              'result |= MTLTextureUsage.RenderTarget.value;',
              'result |= MTLTextureUsage.ShaderRead.value;',
          )
          missing = [needle for needle in required_usage if needle not in texture]
          if missing:
              raise SystemExit('Metal render-target-to-shader-read usage is incomplete: ' + ', '.join(missing))

          required_binding = (
              'public void bindTexture(final @NonNull String name',
              'samplers.put(name, new TextureViewAndSampler(textureView, sampler));',
              'bindTexture(enc, textureView.nativeHandle(), binding.bindingIndex(), binding.stageMask());',
          )
          missing = [needle for needle in required_binding if needle not in render_pass]
          if missing:
              raise SystemExit('Metal reflected sampled-texture binding support is incomplete: ' + ', '.join(missing))

          if 'copyTextureToTexture(' not in encoder or 'blit.copyFromTextureToTexture(' not in encoder:
              raise SystemExit('Metal generic texture copy path needed by the shadowtex1 snapshot is missing')

          for forbidden in ('shadow_entities', 'shadowtex0', 'shadowtex1', 'shadowcolor0', 'shadowcolor1'):
              if forbidden in backend:
                  raise SystemExit('Shader-pack shadow semantics leaked into Metallum backend source: ' + forbidden)

          print('Metal shadow batch prerequisite: generic entity vertex/resource, D32 depth copy/sample and two-color attachment execution remain backend-neutral')
          PY
      - name: validate batched shadow smoke launcher
        run: |
          bash -n tools/run-vitrail-shadow-batch-smoke.sh
          grep -q 'shadow-entities-contract' tools/run-vitrail-shadow-batch-smoke.sh
          grep -q 'shadow-depth-contract' tools/run-vitrail-shadow-batch-smoke.sh
          grep -q 'shadow-color-contract' tools/run-vitrail-shadow-batch-smoke.sh
          grep -q 'VerifyShadowBatchScreenshot.java' tools/run-vitrail-shadow-batch-smoke.sh
          grep -q -- '--entities' tools/run-vitrail-shadow-batch-smoke.sh
          grep -q -- '--depth' tools/run-vitrail-shadow-batch-smoke.sh
          grep -q -- '--color' tools/run-vitrail-shadow-batch-smoke.sh
          grep -q -- '--verify-existing' tools/run-vitrail-shadow-batch-smoke.sh
          grep -q 'entity pass with shadow_entities' tools/run-vitrail-shadow-batch-smoke.sh
          ! grep -q 'entities in the shadow map pass with shadow_entities' tools/run-vitrail-shadow-batch-smoke.sh
          grep -q 'shadow_translucent chunk pass with shadow' tools/run-vitrail-shadow-batch-smoke.sh
          grep -q 'shadowcolor0 and shadowcolor1' tools/run-vitrail-shadow-batch-smoke.sh
          grep -q 'latest completed shadow batch without launching Minecraft' tools/run-vitrail-shadow-batch-smoke.sh
          grep -q 'shadow mipmaps remain pending' tools/run-vitrail-shadow-batch-smoke.sh
          grep -Fq 'Stopping!' tools/run-vitrail-shadow-batch-smoke.sh
