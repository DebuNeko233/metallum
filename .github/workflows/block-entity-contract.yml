name: block-entity-contract
run-name: ${{ github.ref_name }}

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  block-entity-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: verify Apple Silicon runner
        run: |
          uname -a
          test "$(uname -m)" = "arm64"
      - name: validate Metal carried entity vertex ABI routing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pipeline = Path('src/main/java/com/metallum/render/MetalCompiledRenderPipeline.java').read_text(encoding='utf-8')
          render_pass = Path('src/main/java/com/metallum/render/MetalRenderPass.java').read_text(encoding='utf-8')

          required_descriptor = (
              'long attributeIndex = 0L;',
              'int bufferIndex = firstAvailableBufferSlot + binding;',
              'format.getVertexSize(),',
              'MTLVertexFormat vertexFormat = MTLVertexFormat.from(element.format());',
              'descriptor.setAttribute(attributeIndex, vertexFormat.value, element.offset(), bufferIndex);',
              'attributeIndex++;',
          )
          missing = [needle for needle in required_descriptor if needle not in pipeline]
          if missing:
              raise SystemExit('Metal carried entity vertex descriptor routing is incomplete: ' + ', '.join(missing))

          required_binding = (
              'int firstSlot = compiledPipeline.firstAvailableVertexBufferSlot();',
              'int count = compiledPipeline.vertexBufferCount();',
              'int metalSlot = firstSlot + slot;',
              'enc.setVertexBuffer(nativeVertexBuffer.metalBuffer(), vertexBuffer.offset(), metalSlot);',
          )
          missing = [needle for needle in required_binding if needle not in render_pass]
          if missing:
              raise SystemExit('Metal carried entity vertex buffer binding is incomplete: ' + ', '.join(missing))

          print('Metal block-entity vertex ABI: the Vitrail-supplied carried format stays generic and fully described')
          PY
      - name: validate block-entity smoke launcher
        run: |
          bash -n tools/run-vitrail-smoke.sh
          grep -q -- '--block-entity-fixture' tools/run-vitrail-smoke.sh
          grep -q 'block-entity-contract' tools/run-vitrail-smoke.sh
          grep -q 'VerifyBlockEntityScreenshot.java' tools/run-vitrail-smoke.sh
          grep -q 'gbuffers_block of block-entity-contract at render stage BLOCK_ENTITIES' tools/run-vitrail-smoke.sh
