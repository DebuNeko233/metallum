# Release-only workflow. It never runs on pull requests, keeping the PR CI surface to one check.
name: release
run-name: ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: verify Apple Silicon runner
        run: |
          sw_vers
          uname -a
          test "$(uname -m)" = "arm64"
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: validate consolidated contracts
        run: python3 tools/ci-contracts.py
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: metallum-release
          path: build/libs/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: metallum-release
          path: release-artifacts
      - name: resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MINECRAFT_VERSION="$(sed -n 's/^minecraft_version=//p' gradle.properties | head -n1)"
          MAIN_JAR="$(find release-artifacts -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' | head -n1)"
          if [ -z "${MAIN_JAR}" ]; then
            echo "Could not find main release jar in release-artifacts" >&2
            exit 1
          fi
          if [ -z "${MINECRAFT_VERSION}" ]; then
            echo "Could not resolve minecraft_version from gradle.properties" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=${MINECRAFT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "main_jar=${MAIN_JAR}" >> "$GITHUB_OUTPUT"
      - name: publish to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: w79ASAJD
          version: ${{ steps.meta.outputs.version }}
          channel: alpha
          loaders: fabric
          game-versions: ${{ steps.meta.outputs.minecraft_version }}
          files: ${{ steps.meta.outputs.main_jar }}
          dependencies: |
            [{ "project_id": "AANobbMI", "dependency_type": "optional" }]
      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/*
