name: particle-contract
run-name: ${{ github.ref_name }}

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  particle-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: verify Apple Silicon runner
        run: |
          uname -a
          test "$(uname -m)" = "arm64"
      - name: validate generic Metal particle execution path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pipeline = Path('src/main/java/com/metallum/render/MetalCompiledRenderPipeline.java').read_text(encoding='utf-8')
          render_pass = Path('src/main/java/com/metallum/render/MetalRenderPass.java').read_text(encoding='utf-8')

          required_descriptor = (
              'long attributeIndex = 0L;',
              'int bufferIndex = firstAvailableBufferSlot + binding;',
              'format.getVertexSize(),',
              'long stepRate = format.getStepRate();',
              'MTLVertexFormat vertexFormat = MTLVertexFormat.from(element.format());',
              'descriptor.setAttribute(attributeIndex, vertexFormat.value, element.offset(), bufferIndex);',
              'attributeIndex++;',
          )
          missing = [needle for needle in required_descriptor if needle not in pipeline]
          if missing:
              raise SystemExit('Metal PARTICLE vertex descriptor routing is incomplete: ' + ', '.join(missing))

          required_binding = (
              'int firstSlot = compiledPipeline.firstAvailableVertexBufferSlot();',
              'int count = compiledPipeline.vertexBufferCount();',
              'int metalSlot = firstSlot + slot;',
              'enc.setVertexBuffer(nativeVertexBuffer.metalBuffer(), vertexBuffer.offset(), metalSlot);',
              'samplers.put(name, new TextureViewAndSampler(textureView, sampler));',
              'bindTextureAndSampler(enc, textureView.nativeHandle(), sampler.nativeHandle(), binding.bindingIndex(), binding.stageMask());',
              'enc.setFragmentTexture(texture, index);',
              'enc.setFragmentSamplerState(sampler, index);',
          )
          missing = [needle for needle in required_binding if needle not in render_pass]
          if missing:
              raise SystemExit('Metal particle vertex/texture binding is incomplete: ' + ', '.join(missing))

          print('Metal particle path: Vitrail-supplied PARTICLE format and per-draw atlas stay on generic bindings')
          PY
      - name: validate particle smoke launcher
        run: |
          bash -n tools/run-vitrail-particle-smoke.sh
          grep -q -- '--opaque' tools/run-vitrail-particle-smoke.sh
          grep -q -- '--translucent' tools/run-vitrail-particle-smoke.sh
          grep -q 'particles-opaque-contract' tools/run-vitrail-particle-smoke.sh
          grep -q 'particles-translucent-contract' tools/run-vitrail-particle-smoke.sh
          grep -q 'VerifyParticleScreenshot.java' tools/run-vitrail-particle-smoke.sh
          grep -Fq 'Drawing the ${pass_name} particles pass with ${program} of ${fixture_name} at render stage PARTICLES' tools/run-vitrail-particle-smoke.sh
          grep -Fq 'minecraft:textures/atlas/particles.png' tools/run-vitrail-particle-smoke.sh
          grep -Fq "[colortex1 MAIN]" tools/run-vitrail-particle-smoke.sh
          grep -Fq 'It also writes the coverage mask' tools/run-vitrail-particle-smoke.sh
          grep -Fq 'Stopping!' tools/run-vitrail-particle-smoke.sh
