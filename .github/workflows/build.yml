# Automatically build the project and run any configured tests for every branch push,
# pull requests, manual runs, and release tags. This provides a compile gate for
# backend work before it is merged.

name: build
run-name: ${{ github.ref_name }}
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: verify Apple Silicon runner
        run: |
          sw_vers
          uname -a
          test "$(uname -m)" = "arm64"
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: validate Metal MRT capability metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          device = Path('src/main/java/com/metallum/render/MetalDevice.java').read_text(encoding='utf-8')
          encoder = Path('src/main/java/com/metallum/render/MetalCommandEncoder.java').read_text(encoding='utf-8')

          advertised = re.search(
              r'new DeviceLimits\(16, 256, 16384, maxMemoryAllocationSize, 0, (\d+)\)',
              device,
          )
          implemented = re.search(r'MAX_COLOR_ATTACHMENTS\s*=\s*(\d+)', encoder)
          if advertised is None or implemented is None:
              raise SystemExit('Could not resolve Metal MRT attachment limits from source')
          if advertised.group(1) != implemented.group(1):
              raise SystemExit(
                  'Metal DeviceLimits advertises '
                  + advertised.group(1)
                  + ' color attachments but the encoder implements '
                  + implemented.group(1)
              )
          print('Metal MRT attachment limit:', advertised.group(1))
          PY
      - name: validate Metal position invariance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          options = Path('src/main/java/com/metallum/mtl/MTLCompileOptions.java').read_text(encoding='utf-8')
          device = Path('src/main/java/com/metallum/mtl/MTLDevice.java').read_text(encoding='utf-8')

          if 'setPreserveInvariance:' not in options or 'JAVA_BOOLEAN' not in options:
              raise SystemExit('MTLCompileOptions does not expose preserveInvariance')
          if 'options.setPreserveInvariance(true);' not in device:
              raise SystemExit('Metal shader-library compilation does not enable preserveInvariance')
          if 'NEW_LIBRARY_WITH_SOURCE.sendPtr(handle, nsSource, options.handle(), errorOut)' not in device:
              raise SystemExit('Metal shader-library compilation does not pass MTLCompileOptions')
          if 'NEW_LIBRARY_WITH_SOURCE.sendPtr(handle, nsSource, MemorySegment.NULL, errorOut)' in device:
              raise SystemExit('Metal shader-library compilation still discards compile options')
          print('Metal shader position invariance: enabled')
          PY
      - name: validate Vitrail smoke runtime configuration
        run: |
          mkdir -p "$RUNNER_TEMP/vitrail-smoke-fixture"
          cat > "$RUNNER_TEMP/vitrail-smoke-fixture/fabric.mod.json" <<'JSON'
          {
            "schemaVersion": 1,
            "id": "vitrail-smoke-fixture",
            "version": "0.0.0",
            "name": "Vitrail smoke fixture",
            "environment": "client"
          }
          JSON
          jar --create --file "$RUNNER_TEMP/vitrail-smoke-fixture.jar" \
            -C "$RUNNER_TEMP/vitrail-smoke-fixture" fabric.mod.json
          ./gradlew dependencies --configuration localRuntime \
            -PvitrailSmokeJar="$RUNNER_TEMP/vitrail-smoke-fixture.jar"
      - name: validate Vitrail smoke launcher
        run: |
          bash -n tools/run-vitrail-smoke.sh
          grep -q -- '--mrt-fixture' tools/run-vitrail-smoke.sh
          grep -q -- '--terrain-fixture' tools/run-vitrail-smoke.sh
          grep -q 'VerifyMrtScreenshot.java' tools/run-vitrail-smoke.sh
          grep -q 'VerifyTerrainScreenshot.java' tools/run-vitrail-smoke.sh
          grep -q 'run/logs/latest.log' tools/run-vitrail-smoke.sh
          grep -q 'Using graphics backend Metal' tools/run-vitrail-smoke.sh
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: metallum
          path: build/libs/

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: metallum
          path: release-artifacts

      - name: resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MINECRAFT_VERSION="$(sed -n 's/^minecraft_version=//p' gradle.properties | head -n1)"
          MAIN_JAR="$(find release-artifacts -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' | head -n1)"
          if [ -z "${MAIN_JAR}" ]; then
            echo "Could not find main release jar in release-artifacts" >&2
            exit 1
          fi
          if [ -z "${MINECRAFT_VERSION}" ]; then
            echo "Could not resolve minecraft_version from gradle.properties" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=${MINECRAFT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "main_jar=${MAIN_JAR}" >> "$GITHUB_OUTPUT"

      - name: publish to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: w79ASAJD
          version: ${{ steps.meta.outputs.version }}
          channel: alpha
          loaders: fabric
          game-versions: ${{ steps.meta.outputs.minecraft_version }}
          files: ${{ steps.meta.outputs.main_jar }}
          dependencies: |
            [{ "project_id": "AANobbMI", "dependency_type": "optional" }]

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/*
