# Automatically build the project and run any configured tests for every branch push,
# pull requests, manual runs, and release tags. This provides a compile gate for
# backend work before it is merged.

name: build
run-name: ${{ github.ref_name }}
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: verify Apple Silicon runner
        run: |
          sw_vers
          uname -a
          test "$(uname -m)" = "arm64"
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: validate Metal MRT capability metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          device = Path('src/main/java/com/metallum/render/MetalDevice.java').read_text(encoding='utf-8')
          encoder = Path('src/main/java/com/metallum/render/MetalCommandEncoder.java').read_text(encoding='utf-8')

          advertised = re.search(
              r'new DeviceLimits\(16, 256, 16384, maxMemoryAllocationSize, 0, (\d+)\)',
              device,
          )
          implemented = re.search(r'MAX_COLOR_ATTACHMENTS\s*=\s*(\d+)', encoder)
          if advertised is None or implemented is None:
              raise SystemExit('Could not resolve Metal MRT attachment limits from source')
          if advertised.group(1) != implemented.group(1):
              raise SystemExit(
                  'Metal DeviceLimits advertises '
                  + advertised.group(1)
                  + ' color attachments but the encoder implements '
                  + implemented.group(1)
              )
          print('Metal MRT attachment limit:', advertised.group(1))
          PY
      - name: validate Metal target format mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path

          formats = Path('src/main/java/com/metallum/mtl/MTLPixelFormat.java').read_text(encoding='utf-8')
          texture = Path('src/main/java/com/metallum/render/MetalGpuTexture.java').read_text(encoding='utf-8')
          pipeline = Path('src/main/java/com/metallum/render/MetalCompiledRenderPipeline.java').read_text(encoding='utf-8')

          expected = (
              'case R8_UNORM -> R8Unorm;',
              'case RG8_UNORM -> RG8Unorm;',
              'case RGBA16_FLOAT -> RGBA16Float;',
              'case RGB10A2_UNORM -> RGB10A2Unorm;',
          )
          missing = [mapping for mapping in expected if mapping not in formats]
          if missing:
              raise SystemExit('Missing Metal GBuffer format mappings: ' + ', '.join(missing))
          if 'this.mtlPixelFormat = MTLPixelFormat.from(format);' not in texture:
              raise SystemExit('Metal texture allocation does not use the shared GpuFormat -> MTLPixelFormat mapping')
          if 'descriptor.pixelFormat(this.mtlPixelFormat);' not in texture:
              raise SystemExit('Metal texture descriptor does not receive the mapped pixel format')
          if 'pipelineDesc.setColorAttachmentFormat(index, MTLPixelFormat.from(colorTarget.format()));' not in pipeline:
              raise SystemExit('Metal render pipeline does not use the shared colour-target format mapping')
          print('Metal GBuffer target formats: texture and pipeline mappings aligned')
          PY
      - name: validate Metal MRT clear routing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          encoder = Path('src/main/java/com/metallum/render/MetalCommandEncoder.java').read_text(encoding='utf-8')
          command_buffer = Path('src/main/java/com/metallum/mtl/MTLCommandBuffer.java').read_text(encoding='utf-8')

          required_encoder = (
              'Vector4fc[] colorClears = new Vector4fc[colorAttachments.size()];',
              'Vector4fc colorClear = colorAttachment.clearValue().orElse(null);',
              'colorClears[index] = colorClear;',
              'colorAttachments,\n                clearColors,',
          )
          missing = [needle for needle in required_encoder if needle not in encoder]
          if missing:
              raise SystemExit('Metal render-pass clear plumbing is incomplete: ' + ', '.join(missing))

          required_native = (
              'Vector4fc clearColor = clearColors == null ? null : clearColors[index];',
              'renderPass.colorAttachment(',
              'index,',
              'clearColor != null ? MTLRenderPassDescriptor.LOAD_ACTION_CLEAR : MTLRenderPassDescriptor.LOAD_ACTION_LOAD,',
              'MTLRenderPassDescriptor.STORE_ACTION_STORE,',
              'clearColor',
          )
          missing = [needle for needle in required_native if needle not in command_buffer]
          if missing:
              raise SystemExit('Native Metal attachment clear routing is incomplete: ' + ', '.join(missing))
          print('Metal GBuffer clears: per-slot clear values reach MTLLoadActionClear')
          PY
      - name: validate Metal MRT write routing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pipeline = Path('src/main/java/com/metallum/render/MetalCompiledRenderPipeline.java').read_text(encoding='utf-8')
          encoder = Path('src/main/java/com/metallum/render/MetalCommandEncoder.java').read_text(encoding='utf-8')
          render_pass = Path('src/main/java/com/metallum/render/MetalRenderPass.java').read_text(encoding='utf-8')
          command_buffer = Path('src/main/java/com/metallum/mtl/MTLCommandBuffer.java').read_text(encoding='utf-8')

          required_pipeline = (
              'ColorTargetState[] colorTargets = info.getColorTargetStates();',
              'for (int index = 0; index < colorTargets.length; index++) {',
              'long writeMask = MTLColorWriteMask.from(colorTarget.writeMask());',
              'pipelineDesc.disableBlending(index, writeMask);',
          )
          missing = [needle for needle in required_pipeline if needle not in pipeline]
          if missing:
              raise SystemExit('Metal colour write-mask routing is incomplete: ' + ', '.join(missing))

          required_encoder = (
              'colorTextures[index] = colorTexture;',
              'colorClears[index] = colorClear;',
          )
          missing = [needle for needle in required_encoder if needle not in encoder]
          if missing:
              raise SystemExit('Metal render attachments do not preserve write slots: ' + ', '.join(missing))

          required_draw = (
              'enc.setRenderPipelineState(pipelineHandle);',
              'enc.drawPrimitives(primitiveType, firstVertex, vertexCount, instanceCount, firstInstance);',
          )
          missing = [needle for needle in required_draw if needle not in render_pass]
          if missing:
              raise SystemExit('Metal draw path is incomplete: ' + ', '.join(missing))

          if 'MTLRenderPassDescriptor.STORE_ACTION_STORE,' not in command_buffer:
              raise SystemExit('Metal colour attachments are not stored after the render pass')
          print('Metal GBuffer writes: per-slot write masks draw and store through native attachments')
          PY
      - name: validate Metal sampled-image routing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          render_pass = Path('src/main/java/com/metallum/render/MetalRenderPass.java').read_text(encoding='utf-8')

          required_binding = (
              'samplers.put(name, new TextureViewAndSampler(textureView, sampler));',
              'commandEncoder.flushPendingClear((MetalGpuTexture) textureView.texture());',
              'markDescriptorDirty(name);',
              'if (binding.kind() == MetalCompiledRenderPipeline.ResourceKind.SAMPLED_IMAGE) {',
              'TextureViewAndSampler textureBinding = samplers.get(binding.name());',
              'bindTextureAndSampler(enc, textureView.nativeHandle(), sampler.nativeHandle(), binding.bindingIndex(), binding.stageMask());',
          )
          missing = [needle for needle in required_binding if needle not in render_pass]
          if missing:
              raise SystemExit('Metal sampled-image descriptor routing is incomplete: ' + ', '.join(missing))

          required_native = (
              'enc.setFragmentTexture(texture, index);',
              'enc.setFragmentSamplerState(sampler, index);',
          )
          missing = [needle for needle in required_native if needle not in render_pass]
          if missing:
              raise SystemExit('Metal sampled images do not reach fragment texture/sampler slots: ' + ', '.join(missing))
          print('Metal GBuffer sampling: texture view and sampler reach fragment descriptor slots')
          PY
      - name: validate Metal ping-pong pass transitions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          encoder = Path('src/main/java/com/metallum/render/MetalCommandEncoder.java').read_text(encoding='utf-8')
          render_pass = Path('src/main/java/com/metallum/render/MetalRenderPass.java').read_text(encoding='utf-8')

          lifecycle = (
              'currentRenderPass = renderPass;',
              'currentRenderPass.materializePendingClear();',
              'currentRenderPass = null;',
              'MetalPipelineSupport.sameHandles(renderColorAttachments, colorAttachments)',
              'endEncoder();',
              'renderEncoder.updateFence(fence, MTLRenderStages.VertexAndFragment);',
              'currentEncoder.endEncoding();',
              'encoder.waitForFence(fence, MTLRenderStages.VertexAndFragment);',
          )
          missing = [needle for needle in lifecycle if needle not in encoder]
          if missing:
              raise SystemExit('Metal ping-pong pass transition contract is incomplete: ' + ', '.join(missing))

          sampling = (
              'samplers.put(name, new TextureViewAndSampler(textureView, sampler));',
              'commandEncoder.flushPendingClear((MetalGpuTexture) textureView.texture());',
          )
          missing = [needle for needle in sampling if needle not in render_pass]
          if missing:
              raise SystemExit('Metal ping-pong sampled surface routing is incomplete: ' + ', '.join(missing))
          print('Metal GBuffer ping-pong: changed attachments end/fence old encoders before later sampled draws')
          PY
      - name: validate Metal position invariance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          options = Path('src/main/java/com/metallum/mtl/MTLCompileOptions.java').read_text(encoding='utf-8')
          device = Path('src/main/java/com/metallum/mtl/MTLDevice.java').read_text(encoding='utf-8')

          if 'setPreserveInvariance:' not in options or 'JAVA_BOOLEAN' not in options:
              raise SystemExit('MTLCompileOptions does not expose preserveInvariance')
          if 'options.setPreserveInvariance(true);' not in device:
              raise SystemExit('Metal shader-library compilation does not enable preserveInvariance')
          if 'NEW_LIBRARY_WITH_SOURCE.sendPtr(handle, nsSource, options.handle(), errorOut)' not in device:
              raise SystemExit('Metal shader-library compilation does not pass MTLCompileOptions')
          if 'NEW_LIBRARY_WITH_SOURCE.sendPtr(handle, nsSource, MemorySegment.NULL, errorOut)' in device:
              raise SystemExit('Metal shader-library compilation still discards compile options')
          print('Metal shader position invariance: enabled')
          PY
      - name: validate Vitrail smoke runtime configuration
        run: |
          mkdir -p "$RUNNER_TEMP/vitrail-smoke-fixture"
          cat > "$RUNNER_TEMP/vitrail-smoke-fixture/fabric.mod.json" <<'JSON'
          {
            "schemaVersion": 1,
            "id": "vitrail-smoke-fixture",
            "version": "0.0.0",
            "name": "Vitrail smoke fixture",
            "environment": "client"
          }
          JSON
          jar --create --file "$RUNNER_TEMP/vitrail-smoke-fixture.jar" \
            -C "$RUNNER_TEMP/vitrail-smoke-fixture" fabric.mod.json
          ./gradlew dependencies --configuration localRuntime \
            -PvitrailSmokeJar="$RUNNER_TEMP/vitrail-smoke-fixture.jar"
      - name: validate Vitrail smoke launcher
        run: |
          bash -n tools/run-vitrail-smoke.sh
          grep -q -- '--mrt-fixture' tools/run-vitrail-smoke.sh
          grep -q -- '--terrain-fixture' tools/run-vitrail-smoke.sh
          grep -q -- '--gbuffer-location-fixture' tools/run-vitrail-smoke.sh
          grep -q -- '--gbuffer-format-fixture' tools/run-vitrail-smoke.sh
          grep -q -- '--gbuffer-clear-fixture' tools/run-vitrail-smoke.sh
          grep -q -- '--gbuffer-write-fixture' tools/run-vitrail-smoke.sh
          grep -q -- '--gbuffer-sampling-fixture' tools/run-vitrail-smoke.sh
          grep -q -- '--gbuffer-pingpong-fixture' tools/run-vitrail-smoke.sh
          grep -q 'gbuffer-location-contract' tools/run-vitrail-smoke.sh
          grep -q 'gbuffer-format-contract' tools/run-vitrail-smoke.sh
          grep -q 'gbuffer-clear-contract' tools/run-vitrail-smoke.sh
          grep -q 'gbuffer-write-contract' tools/run-vitrail-smoke.sh
          grep -q 'gbuffer-sampling-contract' tools/run-vitrail-smoke.sh
          grep -q 'gbuffer-pingpong-contract' tools/run-vitrail-smoke.sh
          grep -q 'VerifyMrtScreenshot.java' tools/run-vitrail-smoke.sh
          grep -q 'VerifyTerrainScreenshot.java' tools/run-vitrail-smoke.sh
          grep -q 'run/logs/latest.log' tools/run-vitrail-smoke.sh
          grep -q 'Using graphics backend Metal' tools/run-vitrail-smoke.sh
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: metallum
          path: build/libs/

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: metallum
          path: release-artifacts

      - name: resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MINECRAFT_VERSION="$(sed -n 's/^minecraft_version=//p' gradle.properties | head -n1)"
          MAIN_JAR="$(find release-artifacts -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' | head -n1)"
          if [ -z "${MAIN_JAR}" ]; then
            echo "Could not find main release jar in release-artifacts" >&2
            exit 1
          fi
          if [ -z "${MINECRAFT_VERSION}" ]; then
            echo "Could not resolve minecraft_version from gradle.properties" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=${MINECRAFT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "main_jar=${MAIN_JAR}" >> "$GITHUB_OUTPUT"

      - name: publish to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: w79ASAJD
          version: ${{ steps.meta.outputs.version }}
          channel: alpha
          loaders: fabric
          game-versions: ${{ steps.meta.outputs.minecraft_version }}
          files: ${{ steps.meta.outputs.main_jar }}
          dependencies: |
            [{ "project_id": "AANobbMI", "dependency_type": "optional" }]

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/*
