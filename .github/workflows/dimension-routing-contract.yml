name: dimension-routing-contract
run-name: ${{ github.ref_name }}

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dimension-routing-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: verify Apple Silicon runner
        run: |
          uname -a
          test "$(uname -m)" = "arm64"
      - name: verify Dimension Routing remains Vitrail-owned
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('src/main/java/com/metallum/render/MetalCommandEncoder.java'),
              Path('src/main/java/com/metallum/mtl/MTLCommandBuffer.java'),
              Path('src/main/java/com/metallum/mtl/MTLBuiltinPipelines.java'),
          ]
          source='\n'.join(p.read_text(encoding='utf-8') for p in files)
          forbidden=(
              'dimension-convention-contract', 'dimension-properties-contract',
              'dimension.properties', 'world0', 'world-1', 'world1',
              'minecraft:the_nether', 'minecraft:the_end', 'vitrail:moon',
          )
          leaked=[term for term in forbidden if term.lower() in source.lower()]
          if leaked:
              raise SystemExit('Dimension routing semantics leaked into generic Metal execution: ' + ', '.join(leaked))
          print('Metal execution remains dimension-semantic-free')
          PY
      - name: validate batched real-device launcher
        run: |
          bash -n tools/run-vitrail-dimension-routing-smoke.sh
          grep -q 'dimension-convention-contract' tools/run-vitrail-dimension-routing-smoke.sh
          grep -q 'dimension-properties-contract' tools/run-vitrail-dimension-routing-smoke.sh
          grep -q 'VerifyDimensionRoutingScreenshot.java' tools/run-vitrail-dimension-routing-smoke.sh
          grep -q 'world0 for minecraft:overworld' tools/run-vitrail-dimension-routing-smoke.sh
          grep -q 'world-1 for minecraft:the_nether' tools/run-vitrail-dimension-routing-smoke.sh
          grep -q 'world1 for minecraft:the_end' tools/run-vitrail-dimension-routing-smoke.sh
          grep -q 'surface for minecraft:overworld' tools/run-vitrail-dimension-routing-smoke.sh
          grep -q 'under for minecraft:the_nether' tools/run-vitrail-dimension-routing-smoke.sh
          grep -q 'catchall for minecraft:the_end' tools/run-vitrail-dimension-routing-smoke.sh
          grep -q -- '--verify-existing' tools/run-vitrail-dimension-routing-smoke.sh
          grep -q 'Batched PHASE 13 Dimension Routing: PASS' tools/run-vitrail-dimension-routing-smoke.sh
          grep -Fq 'Stopping!' tools/run-vitrail-dimension-routing-smoke.sh
