plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
	accessWidenerPath = file("src/main/resources/metallum.accesswidener")
}

repositories {
	maven { url = "https://api.modrinth.com/maven" }
}

// Optional developer-only bridge for running a built Vitrail Fabric jar in Metallum's Loom client.
// Nothing is added to a normal build or run unless the property is supplied explicitly.
def vitrailSmokeJar = providers.gradleProperty("vitrailSmokeJar")

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "maven.modrinth:sodium:${project.sodium_version}"

	if (vitrailSmokeJar.isPresent()) {
		localRuntime files(vitrailSmokeJar.get())
		localRuntime "net.fabricmc.fabric-api:fabric-key-mapping-api-v1:2.0.5+e2bdee789e"
		localRuntime "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:4.1.4+29b6eb019e"
	}
}

// Extra JVM arguments for the client run, from a Gradle property. The performance harness sets one
// -Dvitrail.* or -Dmetallum.* switch per run so that two runs of one scene can be compared, and
// nothing is added to a normal run unless the property is supplied explicitly.
def vitrailPerfVmArgs = providers.gradleProperty("vitrailPerfVmArgs")

loom {
	runs {
		client {
			if (vitrailSmokeJar.isPresent()) {
				property("vitrail.experimentalMetal", "true")
			}

			// macOS's own Metal Performance HUD, on for every dev client run, so the frame can be
			// watched while it is being drawn instead of inferred from a log afterwards: it reads
			// frames a second, the GPU time of the frame the card really ran, the device, and the
			// scaler's own metrics when MetalFX is on. It costs a little of what it reads, and both
			// arms of a comparison carry the same overlay, so a number read under it is a number
			// about the same frame either way. The ambient value wins where there is one, which is
			// the way to take a reading with the overlay out of the frame entirely:
			// MTL_HUD_ENABLED=0 ./gradlew runClient.
			environmentVariable("MTL_HUD_ENABLED", System.getenv("MTL_HUD_ENABLED") ?: "1")

			if (vitrailPerfVmArgs.isPresent()) {
				vitrailPerfVmArgs.get().split("\\s+").each { argument ->
					if (!argument.isEmpty()) {
						vmArg argument
					}
				}
			}
		}
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here are used for publishing your artifact, not for retrieving dependencies.
	}
}
